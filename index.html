<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mitropolit — визитка</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Courier New", monospace;
      color: #fff;
      overflow: hidden;
    }

    /* фоновое видео */
    #bgvideo {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -1;
      object-fit: cover;
    }

    .content {
      position: absolute;
      top: 10%; /* верхняя треть */
      width: 100%;
      text-align: center;
      padding: 20px;
      text-shadow: 0 0 15px black, 0 0 25px black;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.3em;
      letter-spacing: 2px;
    }

    h2 {
      font-size: 1.6rem;
      margin-bottom: 0.8em;
      color: #c48a4a; /* коричневый */
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 1.5em;
    }

    a.button {
      display: inline-block;
      padding: 12px 25px;
      font-size: 1.2rem;
      color: #fff;
      border: 1px solid #fff;
      text-decoration: none;
      border-radius: 4px;
      transition: 0.3s;
      background: rgba(0,0,0,0.4);
    }

    a.button:hover {
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body>

  <!-- твоё видео -->
  <video autoplay muted loop id="bgvideo">
    <source src="bg.mp4" type="video/mp4">
  </video>

  <div class="content">
    <h1>mitropolit</h1>
    <h2>@mitropolit</h2>
    <p>Нарциссизм — отличительная от вас черта характера</p>
    <a class="button" href="https://t.me/mitropoIit">Telegram</a>
  </div>

</body>
</html>
